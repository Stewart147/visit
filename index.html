<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Visitor Counter</title>

    <style>
        .counter-box {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f0f0f0;
            border-radius: 8px;
            display: inline-block;
        }

        #visitor-count {
            font-weight: bold;
            color: #007BFF;
        }
    </style>
</head>
<body>

    <div class="counter-box">
        <h2>
            Total Visitors:
            <span id="visitor-count">Loading...</span>
        </h2>
    </div>

    <script>
        // A unique counter key for your website
        const counterURL =
            "https://countapi.mileshilliard.com/api/v1/hit/stewart147_github_io_visit_homepage";

        async function updateCounter() {
            const display = document.getElementById("visitor-count");

            try {
                const response = await fetch(counterURL);

                if (!response.ok) {
                    throw new Error("Counter service returned an error");
                }

                const data = await response.json();

                if (data.value === undefined) {
                    throw new Error("Invalid counter response");
                }

                display.textContent =
                    Number(data.value).toLocaleString();

            } catch (error) {
                console.error("Visitor counter error:", error);
                display.textContent = "Unavailable";
            }
        }

        // Increment once whenever this page loads
        updateCounter();
    </script>

</body>
</html>
